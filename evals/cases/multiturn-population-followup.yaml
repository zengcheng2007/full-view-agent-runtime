schema_version: "1.0"
case_id: multiturn-population-followup
description: "S1-B：同一会话中先查西湖区独居老人，再基于可信历史结果追问"
user_message: 查询西湖区独居老人数量，按街道汇总。
auth:
  area_codes: ["3301"]
  datasets: [administrative_area, population]
  entitlements: [governance.area.read, governance.population.aggregate.read]
  field_policy_set: governance_analyst_v1
model_steps:
  - type: tool_call
    tool_id: governance.resolve_area
    arguments: {query: 西湖区}
  - type: tool_call
    tool_id: governance.semantic_query
    arguments:
      spec:
        subject: population
        metrics: [person_count]
        scope: {area_code: "330106", include_descendants: true}
        filters:
          - {field: person_category, operator: eq, value: solitary_elderly}
        group_by: [street]
  - type: finish
    content: 西湖区独居老人按街道汇总查询完成。
expected:
  terminal_status: completed
  outcome: success
  completion_reason_code: goal_completed
  tool_ids: [governance.resolve_area, governance.semantic_query]
  min_evidence_count: 2
  required_event_types: [tool.completed, result.available, evidence.available, run.completed]
follow_up_turns:
  - user_message: 哪个街道最多？直接根据刚才结果回答。
    model_steps:
      - type: finish
        content: 根据刚才已验证的结果，示例街道最多，为128人。
    expected:
      terminal_status: completed
      outcome: success
      completion_reason_code: goal_completed
      tool_ids: []
      min_evidence_count: 0
      max_evidence_count: 0
      required_event_types: [run.completed]
      required_answer_substrings: ["128"]
