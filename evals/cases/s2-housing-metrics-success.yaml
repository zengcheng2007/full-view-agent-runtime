    tool_id: governance.resolve_area
    arguments:
      query: 西湖区
  - type: tool_call
    tool_id: governance.semantic_query
    arguments:
      spec:
        subject: housing
        metrics: [dwelling_count]
        scope: {area_code: "330106", include_descendants: true}
  - type: finish
    content: 西湖区出租房按类型统计已完成，共5种类型。
expected:
  terminal_status: completed
  outcome: success
  completion_reason_code: goal_completed
  tool_ids: [governance.resolve_area, governance.semantic_query]
  min_evidence_count: 0
  required_event_types: [tool.completed, result.available, run.completed]
