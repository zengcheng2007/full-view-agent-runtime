schema_version: "1.0"
case_id: s5-comprehensive-overview
description: "S5: 西湖区治理要素综合概览（组合多Tool）"
user_message: 给我一份西湖区治理要素综合概览，包括人口、出租房和事件办结率
auth:
  area_codes: ["3301"]
  datasets: [administrative_area, population, housing, event]
  entitlements:
    - governance.area.read
    - governance.population.aggregate.read
    - governance.housing.aggregate.read
    - governance.event.aggregate.read
  field_policy_set: governance_analyst_v1
model_steps:
  - type: tool_call
    tool_id: governance.resolve_area
    arguments:
      query: 西湖区
  - type: tool_call
    tool_id: governance.semantic_query
    arguments:
      spec:
        subject: population
        metrics: [person_count]
        scope: {area_code: "330106", include_descendants: true}
        filters:
          - {field: person_category, operator: eq, value: solitary_elderly}
        group_by: [street]
  - type: tool_call
    tool_id: governance.query_housing_metrics
    arguments:
      query:
        scope: {area_code: "330106", include_descendants: true}
  - type: tool_call
    tool_id: governance.query_event_metrics
    arguments:
      query:
        scope: {area_code: "330106", include_descendants: true}
  - type: finish
    content: 西湖区治理要素综合概览已完成，涵盖独居老人分布、出租房类型统计和网格事件办结率。
expected:
  terminal_status: completed
  outcome: success
  completion_reason_code: goal_completed
  tool_ids:
    - governance.resolve_area
    - governance.semantic_query
    - governance.query_housing_metrics
    - governance.query_event_metrics
  min_evidence_count: 0
  required_event_types: [tool.completed, result.available, run.completed]
