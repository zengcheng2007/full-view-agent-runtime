schema_version: "1.0"
case_id: planning-housing-next-area-http-success
description: 通过正式 HTTP Adapter 查询西湖区出租房按下级区划（街道）分布
user_message: 查询西湖区出租房按街道的分布
auth:
  area_codes: ["3301"]
  datasets: [administrative_area, housing]
  entitlements: [governance.area.read, governance.housing.aggregate.read]
model_steps:
  - type: tool_call
    tool_id: governance.resolve_area
    arguments:
      query: 西湖区
    total_tokens: 100
  - type: tool_call
    tool_id: governance.query_housing_metrics
    arguments:
      query:
        scope: {area_code: "330106", include_descendants: true}
        group_by: [next_area]
    total_tokens: 120
  - type: finish
    content: 西湖区出租房按街道分布查询已完成。
    total_tokens: 30
expected:
  terminal_status: completed
  outcome: success
  completion_reason_code: goal_completed
  tool_ids: [governance.resolve_area, governance.query_housing_metrics]
  min_evidence_count: 2
  required_event_types: [tool.completed, result.available, evidence.available, run.completed]
