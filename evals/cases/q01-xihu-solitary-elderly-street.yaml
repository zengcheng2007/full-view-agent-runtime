schema_version: "1.0"
case_id: q01-xihu-solitary-elderly-street
description: "Q01/S1: 查询西湖区独居老人数量，并按街道汇总（区划解析+人口Tool+表格+证据）"
user_message: 查询西湖区独居老人数量，并按街道汇总。
auth:
  area_codes: ["3301"]
  datasets: [administrative_area, population, housing, event, governance_objects]
  entitlements: [governance.area.read, governance.population.aggregate.read, governance.housing.aggregate.read, governance.event.aggregate.read, governance.object.profile.read]
model_steps:
  - type: tool_call
    tool_id: governance.resolve_area
    arguments:
      query: 西湖区
  - type: tool_call
    tool_id: governance.query_population_metrics
    arguments:
      query:
        metrics: [person_count]
        scope: {area_code: "330106", include_descendants: true}
        filters:
          - {field: person_category, operator: eq, value: solitary_elderly}
        group_by: [street]
  - type: finish
    content: 西湖区独居老人按街道汇总查询已完成，结果以表格展示并附证据。
expected:
  terminal_status: completed
  outcome: success
  completion_reason_code: goal_completed
  tool_ids: [governance.resolve_area, governance.query_population_metrics]
  min_evidence_count: 2
  required_event_types: [tool.completed, result.available, evidence.available, run.completed]
