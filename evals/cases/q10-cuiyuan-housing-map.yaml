schema_version: "1.0"
case_id: q10-cuiyuan-housing-map
description: "Q10/S2: 把出租房分布显示在地图上（数据可得，地图分色命令未接线时如实说明）"
user_message: 把出租房分布显示在地图上。
auth:
  area_codes: ["3301"]
  datasets: [administrative_area, population, housing, event, governance_objects]
  entitlements: [governance.area.read, governance.population.aggregate.read, governance.housing.aggregate.read, governance.event.aggregate.read, governance.object.profile.read]
  field_policy_set: governance_analyst_v1
model_steps:
  - type: tool_call
    tool_id: governance.resolve_area
    arguments:
      query: 翠苑街道
      context_area_code: "330106"
  - type: tool_call
    tool_id: governance.semantic_query
    arguments:
      spec:
        subject: housing
        metrics: [dwelling_count]
        scope: {area_code: "330106001", include_descendants: true}
        group_by: [next_area]
  - type: finish
    content: 已取得按社区的出租房分布数据并可展示表格；出租房地图分色命令尚未接线。
expected:
  terminal_status: completed
  outcome: success
  completion_reason_code: goal_completed
  tool_ids: [governance.resolve_area, governance.semantic_query]
  min_evidence_count: 2
  required_event_types: [tool.completed, result.available, evidence.available, run.completed]
  required_answer_substrings: [分布]
