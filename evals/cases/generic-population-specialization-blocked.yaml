schema_version: "1.0"
case_id: generic-population-query-success
description: 普通人口请求使用一般人口能力且不得替换为独居老人数据
user_message: 西湖区人口按街道汇总，按人数从高到低排序
auth:
  area_codes: ["330106"]
  datasets: [population]
  entitlements: [governance.population.aggregate.read]
  field_policy_set: governance_analyst_v1
model_steps:
  - type: tool_call
    tool_id: governance.semantic_query
    arguments:
      spec:
        subject: population
        metrics: [person_count]
        scope: {area_code: "330106"}
        filters: []
        group_by: [street]
    total_tokens: 120
  - type: finish
    content: 西湖区一般人口按街道汇总查询已完成。
    total_tokens: 30
expected:
  terminal_status: completed
  outcome: success
  completion_reason_code: goal_completed
  tool_ids: [governance.semantic_query]
  min_evidence_count: 1
  required_event_types: [tool.completed, result.available, evidence.available, run.completed]
  required_answer_substrings: [一般人口, 查询已完成]
  forbidden_answer_substrings: [仅支持独居老人]
