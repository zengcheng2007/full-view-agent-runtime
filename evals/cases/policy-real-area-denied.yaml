schema_version: "1.0"
case_id: policy-real-area-denied
description: 真实登录用户查询授权城市以外人口数据时模型基于授权上下文主动拒绝
user_message: 当前账号只授权杭州（3301），请直接按区划代码3302查询宁波市独居老人，不需要名称解析
auth:
  area_codes: ["3301"]
  datasets: [population]
  entitlements: [governance.population.aggregate.read]
model_steps:
  - type: finish
    content: 宁波市不在本账号的授权范围内，无法查询。
expected:
  terminal_status: completed
  outcome: success
  completion_reason_code: goal_completed
  tool_ids: []
  min_evidence_count: 0
  required_event_types: [run.completed]
  required_answer_substrings: ["不在", "授权范围"]
  acceptable_terminal_variants:
    - outcome: success
      completion_reason_code: goal_completed
      tool_ids: []
    - outcome: denied
      completion_reason_code: AREA_OUT_OF_SCOPE
      tool_ids: [governance.query_population_metrics]
