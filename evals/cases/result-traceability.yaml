schema_version: "1.0"
case_id: result-traceability
description: 多步骤区划解析和人口查询必须产生结果与证据链
user_message: 先识别西湖区，再查询该区独居老人数量
auth:
  area_codes: ["330106"]
  datasets: [administrative_area, population]
  entitlements: [governance.area.read, governance.population.aggregate.read]
  field_policy_set: governance_analyst_v1
model_steps:
  - type: tool_call
    tool_id: governance.resolve_area
    arguments:
      query: 西湖区
  - type: tool_call
    tool_id: governance.semantic_query
    arguments:
      spec:
        subject: population
        metrics: [person_count]
        scope: {area_code: "330106"}
        filters:
          - field: person_category
            operator: eq
            value: solitary_elderly
        group_by: [street]
  - type: finish
    content: 西湖区独居老人查询完成，结果附带证据引用。
expected:
  terminal_status: completed
  outcome: success
  completion_reason_code: goal_completed
  tool_ids: [governance.resolve_area, governance.semantic_query]
  min_evidence_count: 2
  required_event_types: [tool.completed, result.available, evidence.available, assistant.message.completed, run.completed]
