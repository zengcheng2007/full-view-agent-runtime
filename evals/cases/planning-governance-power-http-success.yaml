schema_version: "1.0"
case_id: planning-governance-power-http-success
description: 解析区划并通过正式 HTTP Adapter 查询西湖区治理力量分类汇总
user_message: 查询西湖区治理力量汇总
auth:
  area_codes: ["3301"]
  datasets: [administrative_area, governance_power]
  entitlements: [governance.area.read, governance.power.aggregate.read]
  field_policy_set: governance_analyst_v1
model_steps:
  - type: tool_call
    tool_id: governance.resolve_area
    arguments:
      query: 西湖区
    total_tokens: 100
  - type: tool_call
    tool_id: governance.semantic_query
    arguments:
      spec:
        subject: governance_power
        metrics: [governance_power_count]
        scope: {area_code: "330106", include_descendants: true}
        output: table
    total_tokens: 120
  - type: finish
    content: 西湖区治理力量分类汇总查询已完成。
    total_tokens: 30
expected:
  terminal_status: completed
  outcome: success
  completion_reason_code: goal_completed
  tool_ids: [governance.resolve_area, governance.semantic_query]
  min_evidence_count: 2
  required_event_types: [tool.completed, result.available, evidence.available, run.completed]
