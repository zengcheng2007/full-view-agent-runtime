schema_version: "1.0"
case_id: policy-area-denied
description: 拒绝查询授权区划范围之外的人口数据
user_message: 查询滨江区独居老人数量
auth:
  area_codes: ["330106"]
  datasets: [population]
  entitlements: [governance.population.aggregate.read]
  field_policy_set: governance_analyst_v1
model_steps:
  - type: tool_call
    tool_id: governance.semantic_query
    arguments:
      spec:
        subject: population
        metrics: [person_count]
        scope: {area_code: "330108"}
        filters:
          - field: person_category
            operator: eq
            value: solitary_elderly
        group_by: [street]
  - type: finish
    content: 当前区划不在授权范围内。
expected:
  terminal_status: completed
  outcome: denied
  completion_reason_code: AREA_OUT_OF_SCOPE
  tool_ids: [governance.semantic_query]
  min_evidence_count: 0
  required_event_types: [tool.completed, run.completed]
