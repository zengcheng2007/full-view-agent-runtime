schema_version: "1.0"
case_id: housing-upstream-timeout
description: 出租房 HTTP Tool 被注入超时后以 upstream_timeout 可靠终止
user_message: 查询西湖区出租房按类型分布
auth:
  area_codes: ["3301"]
  datasets: [administrative_area, housing]
  entitlements: [governance.area.read, governance.housing.aggregate.read]
  field_policy_set: governance_analyst_v1
fault:
  type: upstream_timeout
  tool_id: governance.query_housing_metrics
model_steps:
  - type: tool_call
    tool_id: governance.resolve_area
    arguments:
      query: 西湖区
  - type: tool_call
    tool_id: governance.semantic_query
    arguments:
      spec:
        subject: housing
        metrics: [dwelling_count]
        scope: {area_code: "330106", include_descendants: true}
  - type: finish
    content: 出租房查询超时，当前无法完成。
expected:
  terminal_status: failed
  outcome: failed
  completion_reason_code: upstream_timeout
  tool_ids: [governance.resolve_area, governance.semantic_query]
  min_evidence_count: 0
  max_evidence_count: 1
  required_event_types: [tool.failed, run.failed]
