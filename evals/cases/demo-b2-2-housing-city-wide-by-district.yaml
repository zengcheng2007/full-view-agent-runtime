schema_version: "1.0"
case_id: demo-b2-2-housing-city-wide-by-district
description: "B2-Demo2: 全市出租房的分布，按区县汇总"
user_message: 全市出租房的分布，按区县汇总。
auth:
  area_codes: ["3301"]
  datasets: [administrative_area, housing]
  entitlements: [governance.area.read, governance.housing.aggregate.read]
  field_policy_set: governance_analyst_v1
model_steps:
  - type: tool_call
    tool_id: governance.resolve_area
    arguments:
      query: 杭州全市
  - type: tool_call
    tool_id: governance.semantic_query
    arguments:
      spec:
        subject: housing
        metrics: [dwelling_count]
        scope: {area_code: "3301", include_descendants: true}
        group_by: [next_area]
  - type: finish
    content: 杭州全市出租房已按区县汇总分布完成。
expected:
  terminal_status: completed
  outcome: success
  completion_reason_code: goal_completed
  tool_ids: [governance.resolve_area, governance.semantic_query]
  min_evidence_count: 2
  required_event_types: [tool.completed, result.available, evidence.available, run.completed]
