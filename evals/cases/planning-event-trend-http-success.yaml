schema_version: "1.0"
case_id: planning-event-trend-http-success
description: 解析区划并通过正式 HTTP Adapter 查询西湖区事件总数月度趋势
user_message: 查询西湖区2026年1月至4月的事件总数月度趋势
auth:
  area_codes: ["3301"]
  datasets: [administrative_area, event]
  entitlements: [governance.area.read, governance.event.aggregate.read]
  field_policy_set: governance_analyst_v1
model_steps:
  - type: tool_call
    tool_id: governance.resolve_area
    arguments:
      query: 西湖区
    total_tokens: 100
  - type: tool_call
    tool_id: governance.semantic_query
    arguments:
      spec:
        subject: event
        metrics: [event_count]
        scope: {area_code: "330106", include_descendants: true}
        group_by: [month]
        time_range: {start: "2026-01-01", end: "2026-04-30"}
    total_tokens: 120
  - type: finish
    content: 西湖区事件总数月度趋势查询已完成。
    total_tokens: 30
expected:
  terminal_status: completed
  outcome: success
  completion_reason_code: goal_completed
  tool_ids: [governance.resolve_area, governance.semantic_query]
  min_evidence_count: 2
  required_event_types: [tool.completed, result.available, evidence.available, run.completed]
