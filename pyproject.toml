[project]
name = "full-view-agent-runtime"
version = "0.1.0"
description = "P0 runtime for the Full Information View agent"
readme = "README.md"
requires-python = ">=3.12,<3.16"
dependencies = [
  "cryptography>=45,<47",
  "fastapi>=0.116,<1.0",
  "httpx>=0.28,<1.0",
  "jsonschema>=4.20,<5.0",
  "pydantic>=2.11,<3.0",
  "pydantic-settings>=2.10,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "pyyaml>=6.0,<7.0",
  "redis>=6.4,<8.0",
  "uvicorn[standard]>=0.35,<1.0",
  "langgraph>=0.6,<1.0",
  "langgraph-checkpoint-postgres>=3.0,<3.1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1.0",
  "pyright>=1.1.411",
  "pytest>=8.4,<10.0",
  "pytest-asyncio>=1.1,<2.0",
  "ruff>=0.12,<1.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/full_view_agent"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"
strict_markers = true
markers = [
    "db: tests that require a real PostgreSQL database (FULL_VIEW_TEST_DATABASE_URL)",
    "redis: tests that require a real Redis instance (FULL_VIEW_TEST_REDIS_URL)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
